<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Triage">
  <!-- Icône de TRIAGE : trois lignes « classées » + pastille de validation.
       100% vectorielle (pas d'emoji) → se rastérise correctement comme icône
       d'application sur le téléphone, contrairement à un emoji en <text>. -->
  <rect width="100" height="100" rx="20" fill="#1c1c1e"/>
  <rect x="22" y="28" width="42" height="9" rx="4.5" fill="#5b8def"/>
  <rect x="22" y="45" width="32" height="9" rx="4.5" fill="#57bfd6"/>
  <rect x="22" y="62" width="22" height="9" rx="4.5" fill="#8a8a95"/>
  <circle cx="69" cy="67" r="16" fill="#3fb96a"/>
  <path d="M61 67 l6 6 l10 -13" fill="none" stroke="#fff" stroke-width="4.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
