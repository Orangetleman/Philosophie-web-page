<!-- /admin/ : le tri des propositions (chantier Administration, lot A2,
     docs/chantier-administration.md ; maquette docs/maquettes/admin.html).

     remplace triage/ et le tableau de bord Flask (lot A6).
     Sécurité : seule la clé publique (« anon ») est ici ; tout passe par
     les fonctions admin_* de la base, qui refusent un compte non inscrit
     dans app_admins (2026_administration.sql).
     /admin/?essai : la même page sur de fausses données (admin/essai.js),
     sans compte ni réseau, pour essayer ou vérifier l'interface.
     Chemins absolus (/admin/…) : l'adresse peut être « /admin » sans barre
     finale. -->

      <button value="oui" class="danger" id="confirmer-oui"></button>
